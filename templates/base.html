<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Analyse scolaire{% endblock %}</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }


        /* =========================
           STRUCTURE GENERALE
        ========================= */

        .app-layout {
            display: flex;
            align-items: stretch;
            min-height: 100vh;
        }


        /* =========================
           MENU LATERAL
        ========================= */

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #1f2937;
            color: #e5e7eb;
            padding: 0 0 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 22px 24px;
            border-bottom: 1px solid #374151;
            margin-bottom: 10px;
        }

        .sidebar-header .sidebar-title {
            font-size: 17px;
            font-weight: bold;
            color: #fff;
            line-height: 1.3;
        }

        .sidebar-header .sidebar-subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .sidebar nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            border-left: 4px solid transparent;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar nav a:hover {
            background: #111827;
            color: #fff;
        }

        .sidebar nav a.active {
            background: #111827;
            color: #fff;
            border-left-color: #2563eb;
        }

        .sidebar nav .menu-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }


        /* =========================
           CONTENU PRINCIPAL
        ========================= */

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }


        @media (max-width: 900px) {

            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .sidebar nav ul {
                display: flex;
                flex-wrap: wrap;
            }

            .sidebar nav a {
                border-left: none;
                border-bottom: 4px solid transparent;
            }

            .sidebar nav a.active {
                border-left-color: transparent;
                border-bottom-color: #2563eb;
            }

            .main-content {
                padding: 18px;
            }

        }

    </style>

    {% block extra_style %}{% endblock %}

</head>


<body>


<div class="app-layout">


    <!-- =========================
         MENU LATERAL
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-header">
            <div class="sidebar-title">📊 Analyse scolaire</div>
            <div class="sidebar-subtitle">Espace de gestion</div>
        </div>

        <nav>
            <ul>

                <li>
                    <a
                        href="{% url 'dashboard' %}"
                        class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                    >
                        <span class="menu-icon">🏠</span>
                        Accueil
                    </a>
                </li>

                <li>
                    <a
                        href="{% url 'resultats' %}"
                        class="{% if request.resolver_match.url_name == 'resultats' %}active{% endif %}"
                    >
                        <span class="menu-icon">📋</span>
                        Résultats
                    </a>
                </li>


                <li>
                    <a
                        href="{% url 'meilleurs_eleves' %}"
                        class="{% if request.resolver_match.url_name == 'meilleurs_eleves' %}active{% endif %}"
                    >
                        <span class="menu-icon">🏆</span>
                        Meilleurs élèves
                    </a>
                </li>

                <li>
                    <a
                        href="{% url 'eleves_a_suivre' %}"
                        class="{% if request.resolver_match.url_name == 'eleves_a_suivre' %}active{% endif %}"
                    >
                        <span class="menu-icon">🎯</span>
                        Élèves à suivre
                    </a>
                </li>

                <li>
                    <a
                        href="{% url 'statistiques' %}"
                        class="{% if request.resolver_match.url_name == 'statistiques' %}active{% endif %}"
                    >
                        <span class="menu-icon">📈</span>
                        Statistiques
                    </a>
                </li>

                <li>
                    <a href="{% url 'export_statistiques_excel' %}">
                        <span class="menu-icon">🗂️</span>
                        Rapports
                    </a>
                </li>

            </ul>
        </nav>

    </aside>


    <!-- =========================
         CONTENU DE LA PAGE
    ========================= -->

    <main class="main-content">

        {% block content %}{% endblock %}

    </main>


</div>


{% block extra_script %}{% endblock %}


</body>

</html>
